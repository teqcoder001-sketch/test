<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VYRALYTIC — See what your content sees</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' fill='%2307070a'/%3E%3Ctext x='8' y='34' font-family='Arial Black' font-size='28' font-weight='900' fill='%232ee6e0'%3EV%3C/text%3E%3Crect x='33' y='18' width='3' height='16' fill='%23ff3b63'/%3E%3Crect x='38' y='24' width='3' height='10' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070a; --bg2:#0a0a10; --panel:rgba(255,255,255,.032); --panel2:rgba(255,255,255,.055);
  --line:rgba(255,255,255,.085); --line2:rgba(255,255,255,.16);
  --ink:#f4f5f9; --dim:#a2a5ba; --faint:#606379;
  --cyan:#2ee6e0; --pink:#ff3b63; --red:#ff2d3f; --ai:#9b8bff;
  --disp:'Unbounded',sans-serif; --body:'Sora',sans-serif; --mono:'IBM Plex Mono',monospace;
  --r:12px; --nav-h:66px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;overflow-x:hidden;
  background-image:
    radial-gradient(1100px 500px at 78% -8%, rgba(46,230,224,.055), transparent 62%),
    radial-gradient(900px 480px at 8% 12%, rgba(255,59,99,.05), transparent 60%),
    linear-gradient(rgba(255,255,255,.024) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.024) 1px, transparent 1px);
  background-size:auto,auto,52px 52px,52px 52px;}
::selection{background:rgba(46,230,224,.28)}
h1,h2,h3{font-family:var(--disp);font-weight:700;line-height:1.14;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;color:inherit;background:none;border:none}
input,select,textarea{font-family:inherit;color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;outline:none;width:100%}
input:focus,textarea:focus{border-color:rgba(46,230,224,.55)}
img{display:block;max-width:100%}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
.kick{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan)}
.kick.pink{color:var(--pink)}.kick.dim{color:var(--faint)}
.mono{font-family:var(--mono)}
.rv{opacity:0;transform:perspective(1100px) translateY(28px) rotateX(7deg);transform-origin:50% 0;transition:opacity .75s cubic-bezier(.2,.7,.2,1),transform .75s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;padding:3px 9px;border-radius:4px;border:1px solid;white-space:nowrap}
.tag.det{color:var(--cyan);border-color:rgba(46,230,224,.4)}
.tag.est{color:var(--ai);border-color:rgba(155,139,255,.45)}
.tag.un{color:var(--faint);border-color:rgba(255,255,255,.14)}
.tag.pink{color:var(--pink);border-color:rgba(255,59,99,.4)}
.tag.plain{color:var(--dim);border-color:var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-family:var(--body);font-weight:600;font-size:14px;padding:13px 24px;border-radius:9px;transition:transform .18s,box-shadow .18s,background .18s,border-color .18s;border:1px solid transparent}
.btn:active{transform:translateY(1px) scale(.99)}
.btn-pri{background:var(--ink);color:#0a0a0e}
.btn-pri:hover{transform:translateY(-2px);box-shadow:0 10px 30px -8px rgba(255,255,255,.28)}
.btn-cyan{border-color:rgba(46,230,224,.5);color:var(--cyan)}
.btn-cyan:hover{background:rgba(46,230,224,.09);transform:translateY(-2px)}
.btn-ghost{border-color:var(--line2);color:var(--dim)}
.btn-ghost:hover{color:var(--ink);border-color:rgba(255,255,255,.3)}
.btn-danger{border-color:rgba(255,59,99,.5);color:var(--pink)}
.btn-danger:hover{background:rgba(255,59,99,.1)}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:7px}
.nav{position:fixed;inset:0 0 auto 0;height:var(--nav-h);z-index:60;display:flex;align-items:center;border-bottom:1px solid rgba(255,255,255,.06);backdrop-filter:blur(16px);background:rgba(7,7,10,.7)}
.nav .wrap{width:100%;display:flex;align-items:center;gap:34px}
.nav-links{display:flex;gap:26px;margin-left:auto}
.nav-links a{font-size:13.5px;color:var(--dim);transition:color .2s}
.nav-links a:hover{color:var(--ink)}
.logo{display:inline-flex;align-items:center;gap:2px;user-select:none}
.logo .v{font-family:var(--disp);font-weight:900;font-size:22px;line-height:1;
  background:linear-gradient(115deg,var(--cyan) 15%,#fff 50%,var(--pink) 88%);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .word{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.1em;margin-left:8px}
.eqbars{display:inline-flex;align-items:flex-end;gap:2.5px;height:17px;margin:0 7px 0 1px}
.eqbars i{width:3px;border-radius:2px;background:var(--cyan);animation:eq 1.1s ease-in-out infinite}
.eqbars i:nth-child(1){height:60%;background:var(--cyan)}
.eqbars i:nth-child(2){height:100%;background:var(--pink);animation-delay:.18s}
.eqbars i:nth-child(3){height:42%;background:#fff;animation-delay:.36s}
@keyframes eq{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
.logo.sm .v{font-size:17px}.logo.sm .word{font-size:11.5px}.logo.sm .eqbars{height:12px}.logo.sm .eqbars i{width:2.5px}
/* ===== HERO (3D stage) ===== */
.hero{padding:calc(var(--nav-h) + 68px) 0 40px;position:relative;perspective:1400px;perspective-origin:50% 32%}
#depthField{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.hero .wrap{position:relative;z-index:2}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:60px;align-items:center}
.hero h1{font-size:clamp(34px,4.6vw,58px);font-weight:900;margin:20px 0 8px}
.hero h1 .l2{color:var(--faint)}
.hero .sub{color:var(--dim);font-size:16px;max-width:520px;margin:16px 0 30px}
.hero .sub b{color:var(--ink);font-weight:600}
.hero-ctas{display:flex;gap:14px;flex-wrap:wrap}
.trust{display:flex;gap:0;margin-top:44px;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:fit-content}
.trust div{padding:12px 20px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--dim);border-right:1px solid var(--line)}
.trust div:last-child{border-right:none}
.trust b{display:block;color:var(--cyan);font-size:12px;margin-bottom:2px}
.device{position:relative;width:min(400px,100%);margin-left:auto;transform-style:preserve-3d;will-change:transform}
.device-frame{position:relative;border:1px solid var(--line2);border-radius:16px;background:rgba(12,13,20,.72);backdrop-filter:blur(14px);overflow:hidden;transform:translateZ(0);box-shadow:0 40px 90px -30px rgba(0,0,0,.85), inset 0 0 0 1px rgba(255,255,255,.03), 0 0 0 1px rgba(46,230,224,.07), 0 0 42px -8px rgba(255,59,99,.13)}
.device-top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--faint)}
.reddot{width:7px;height:7px;border-radius:50%;background:var(--pink);animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.device canvas{display:block;width:100%;aspect-ratio:9/13}
.chiprow{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.dchip{font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:4px 9px;border:1px solid var(--line);border-radius:5px;color:var(--dim)}
.dchip b{color:var(--cyan);font-weight:500}
.float-card{position:absolute;z-index:3;background:rgba(13,14,22,.82);backdrop-filter:blur(14px);border:1px solid var(--line2);border-radius:12px;padding:13px 16px;box-shadow:0 24px 60px -18px rgba(0,0,0,.8);transform-style:preserve-3d}
.fc-hook{top:9%;left:-58px;transform:translateZ(85px)}
.fc-rec{bottom:23%;right:-46px;max-width:225px;transform:translateZ(55px)}
.floaty{animation:floaty 6.5s ease-in-out infinite}
.fc-rec .floaty{animation-delay:1.4s}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.fc-hook .kick{margin-top:8px;display:block}
.fc-rec .tt{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--pink);margin-bottom:5px}
.fc-rec .tx{font-size:12.5px;line-height:1.5;color:var(--dim)}
.fc-rec .tx b{color:var(--ink)}
.strip{display:flex;gap:3px;padding:9px 12px;border-top:1px solid var(--line);overflow:hidden}
.strip canvas{width:26px;aspect-ratio:9/16;border-radius:2px;flex:none;background:#141520}
.scroll-cue{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:3;font-family:var(--mono);font-size:9px;letter-spacing:.34em;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:8px}
.scroll-cue i{width:1px;height:38px;background:linear-gradient(var(--cyan),transparent);display:block;animation:cue 1.8s ease-in-out infinite}
@keyframes cue{0%{transform:scaleY(0);transform-origin:top}45%{transform:scaleY(1);transform-origin:top}55%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.ticker{margin:56px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;padding:13px 0;background:rgba(255,255,255,.014)}
.ticker-inner{display:flex;gap:0;width:max-content;animation:tick 36s linear infinite}
.ticker span{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--faint);padding:0 26px;white-space:nowrap}
.ticker span::after{content:"◆";color:var(--cyan);font-size:7px;margin-left:52px;vertical-align:2px}
@keyframes tick{to{transform:translateX(-50%)}}
section{padding:104px 0;position:relative}
.sec-head{margin-bottom:54px;max-width:640px}
.sec-head h2{font-size:clamp(26px,3.2vw,40px);margin-top:16px}
.sec-head p{color:var(--dim);margin-top:14px}
.pl-grid{display:grid;grid-template-columns:5fr 7fr;gap:70px;align-items:start}
.pl-sticky{position:sticky;top:110px}
.pl-step{display:grid;grid-template-columns:64px 1fr;gap:22px;padding:26px 0;border-bottom:1px solid var(--line)}
.pl-step:last-child{border-bottom:none}
.pl-num{font-family:var(--disp);font-weight:900;font-size:26px;color:transparent;-webkit-text-stroke:1px var(--faint)}
.pl-step h3{font-size:16.5px;font-family:var(--body);font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pl-step p{color:var(--dim);font-size:14px;margin-top:8px}
.pl-step .off{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--faint);border:1px dashed var(--line2);padding:3px 8px;border-radius:4px}
.ev-card{position:sticky;top:110px;border:1px solid var(--line2);border-radius:14px;background:rgba(12,13,20,.75);backdrop-filter:blur(12px);padding:26px;box-shadow:0 30px 70px -25px rgba(0,0,0,.8)}
.ev-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:18px}
.ev-head h4{font-family:var(--disp);font-size:15px}
.ev-score{font-family:var(--mono);font-size:26px;font-weight:600}
.ev-score small{font-size:12px;color:var(--faint)}
.ev-row{display:grid;grid-template-columns:88px 1fr;gap:14px;padding:10px 0;font-size:13.5px}
.ev-row .k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--faint);padding-top:3px}
.ev-row .v{color:var(--dim)}.ev-row .v b{color:var(--ink);font-weight:600}
.ev-foot{margin-top:16px;padding:12px 14px;border:1px dashed var(--line2);border-radius:8px;font-family:var(--mono);font-size:11px;color:var(--faint);line-height:1.7}
.ev-foot b{color:var(--cyan);font-weight:500}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:44px}
.leg{border:1px solid var(--line);border-radius:10px;padding:16px}
.leg p{font-size:12.5px;color:var(--dim);margin-top:8px}
.mode-row{display:grid;grid-template-columns:190px 1fr auto;gap:26px;align-items:center;padding:26px 0;border-bottom:1px solid var(--line)}
.mode-row:first-of-type{border-top:1px solid var(--line)}
.mode-name{font-family:var(--disp);font-size:17px;display:flex;align-items:center;gap:12px}
.mode-dot{width:9px;height:9px;border-radius:2px;transform:rotate(45deg)}
.mode-spec{font-family:var(--mono);font-size:11.5px;color:var(--dim);letter-spacing:.06em;line-height:2}
.mode-spec b{color:var(--ink);font-weight:500}
.honest-row{display:grid;grid-template-columns:290px 1fr;gap:40px;padding:32px 0;border-bottom:1px solid var(--line)}
.honest-row:first-of-type{border-top:1px solid var(--line)}
.honest-row h3{font-size:17px;font-family:var(--body);font-weight:700;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.honest-row p{color:var(--dim);font-size:14px;max-width:640px}
.honest-row p b{color:var(--ink)}
.final{text-align:center;padding:130px 0 90px}
.final h2{font-size:clamp(34px,5.4vw,66px);font-weight:900}
.final h2 em{font-style:normal;color:var(--cyan)}
.final p{color:var(--dim);margin:20px 0 36px}
footer{border-top:1px solid var(--line);padding:30px 0 40px}
.foot-in{display:flex;align-items:center;gap:26px;flex-wrap:wrap;color:var(--faint);font-family:var(--mono);font-size:11px;letter-spacing:.1em}
/* ===== SHELL ===== */
.shell{display:none;min-height:100vh}
.shell.on{display:flex}
.side{width:236px;flex:none;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;background:rgba(9,9,14,.6);backdrop-filter:blur(12px);z-index:50}
.side .logo{padding:6px 10px 20px;display:flex}
.side-badge{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:3px 7px;margin-left:auto}
.nav-grp{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--faint);padding:16px 12px 7px}
.nitem{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;font-size:13.5px;color:var(--dim);width:100%;text-align:left;transition:background .15s,color .15s;border:1px solid transparent}
.nitem:hover{color:var(--ink);background:rgba(255,255,255,.04)}
.nitem.on{color:var(--ink);background:rgba(46,230,224,.07);border-color:rgba(46,230,224,.22)}
.nitem.on .ic{color:var(--cyan)}
.nitem .ic{width:16px;height:16px}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:14px 10px 4px}
.sess{display:flex;align-items:center;gap:11px}
.avatar{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,rgba(46,230,224,.25),rgba(255,59,99,.25));display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:13px;flex:none}
.sess .em{font-size:12px;color:var(--dim);word-break:break-all;line-height:1.3}
.logout{margin-left:auto;color:var(--faint);padding:5px;border-radius:6px}
.logout:hover{color:var(--pink)}
.main{flex:1;min-width:0}
.topbar{height:var(--nav-h);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 30px;position:sticky;top:0;background:rgba(7,7,10,.78);backdrop-filter:blur(14px);z-index:40}
.topbar h1{font-size:16px;font-weight:700;font-family:var(--body)}
.topbar .sp{margin-left:auto}
.menubtn{display:none;padding:7px;border:1px solid var(--line);border-radius:8px}
.view{padding:34px 30px 80px;max-width:1160px}
.ov-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:30px}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:18px;background:var(--panel)}
.stat .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--faint);text-transform:uppercase}
.stat .v{font-family:var(--disp);font-size:27px;font-weight:700;margin-top:8px}
.stat .v small{font-size:13px;color:var(--faint);font-family:var(--mono);font-weight:400}
.stat .s{font-size:11.5px;color:var(--dim);margin-top:4px}
.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:22px}
.panel h3{font-size:15px;font-family:var(--body);font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:44px 24px;text-align:center;color:var(--dim)}
.empty .ic{width:26px;height:26px;margin:0 auto 12px;color:var(--faint)}
.proj-row{display:grid;grid-template-columns:56px 1fr auto auto;gap:16px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;margin-bottom:10px;background:var(--panel);transition:border-color .2s,transform .2s}
.proj-row:hover{border-color:rgba(46,230,224,.3);transform:translateX(3px)}
.proj-row .th{width:56px;aspect-ratio:9/14;border-radius:6px;object-fit:cover;background:#101019;border:1px solid var(--line)}
.proj-row .nm{font-weight:600;font-size:14.5px}
.proj-row .mt{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:3px;letter-spacing:.06em}
.proj-score{font-family:var(--mono);font-size:19px;font-weight:600;text-align:right}
.proj-score small{display:block;font-size:9px;letter-spacing:.16em;color:var(--faint);font-weight:400}
.iconbtn{padding:8px;border-radius:7px;color:var(--faint);border:1px solid transparent}
.iconbtn:hover{color:var(--ink);border-color:var(--line2)}
.dz{border:1.5px dashed var(--line2);border-radius:16px;padding:56px 28px;text-align:center;transition:border-color .2s,background .2s;cursor:pointer}
.dz:hover,.dz.over{border-color:var(--cyan);background:rgba(46,230,224,.04)}
.dz .ic{width:34px;height:34px;margin:0 auto 16px;color:var(--cyan)}
.dz h3{font-size:17px;font-family:var(--body);font-weight:700}
.dz p{color:var(--dim);font-size:13px;margin-top:8px}
.dz .limits{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.1em;margin-top:18px}
.plat-chips{display:flex;gap:9px;margin:0 0 20px;flex-wrap:wrap}
.pchip{font-family:var(--mono);font-size:11px;letter-spacing:.12em;padding:9px 16px;border:1px solid var(--line);border-radius:8px;color:var(--dim);transition:all .18s}
.pchip:hover{border-color:var(--line2);color:var(--ink)}
.pchip.on{border-color:var(--cyan);color:var(--cyan);background:rgba(46,230,224,.07)}
.pipe{border:1px solid var(--line);border-radius:var(--r);background:rgba(11,12,18,.7);font-family:var(--mono);font-size:12.5px;overflow:hidden}
.pipe-row{display:flex;align-items:center;gap:13px;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.05);color:var(--faint)}
.pipe-row .st{width:16px;display:flex;justify-content:center}
.pipe-row .dt{margin-left:auto;font-size:10.5px;color:var(--faint);letter-spacing:.05em;max-width:46%;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pipe-row.run{color:var(--ink)}
.pipe-row.done{color:var(--dim)}.pipe-row.done .st{color:var(--cyan)}
.pipe-row.skip .st{color:var(--faint)}
.pipe-row.err{color:var(--pink)}
.spin{width:12px;height:12px;border:1.6px solid rgba(255,255,255,.15);border-top-color:var(--cyan);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.prog{height:3px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden;margin-top:2px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));width:0%;transition:width .25s}
/* ===== REPORT ===== */
.rep-head{display:flex;gap:24px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:22px;background:var(--panel);flex-wrap:wrap}
.rep-head .th{width:74px;aspect-ratio:9/14;border-radius:8px;object-fit:cover;background:#101019;border:1px solid var(--line2)}
.rep-title h2{font-size:21px;font-family:var(--body);display:flex;align-items:center;gap:10px}
.rep-title h2 .ic{width:14px;height:14px;color:var(--faint)}
.rep-title .nm{cursor:pointer;border-bottom:1px dashed transparent}
.rep-title .nm:hover{color:var(--cyan);border-bottom-color:rgba(46,230,224,.4)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.ring-wrap{text-align:center;margin-left:auto}
.ring-wrap .cap{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--faint);margin-top:6px}
.ring{transform:rotate(-90deg)}
.ring .track{fill:none;stroke:rgba(255,255,255,.08);stroke-width:7}
.ring .val{fill:none;stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.7,.2,1)}
.ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--disp);font-weight:900;font-size:30px}
.ring-num small{font-size:9px;font-family:var(--mono);letter-spacing:.18em;color:var(--faint);font-weight:400;margin-top:2px}
.provbar{display:flex;gap:14px;align-items:center;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint);margin:22px 2px 6px;flex-wrap:wrap}
.rep-grid{display:grid;grid-template-columns:1fr;gap:18px;margin-top:18px}
.rep-cols{display:grid;grid-template-columns:1.25fr .85fr;gap:18px;align-items:start}
.player-grid{display:grid;grid-template-columns:216px 1fr;gap:18px}
.player{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line2);background:#000;aspect-ratio:9/16}
.player video{width:100%;height:100%;object-fit:contain;display:block}
.player .pbtn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25);transition:opacity .2s}
.player .pbtn .ic{width:40px;height:40px;stroke-width:1.4;filter:drop-shadow(0 4px 14px rgba(0,0,0,.7))}
.pctrl{display:flex;align-items:center;gap:12px;padding:10px 2px 0;font-family:var(--mono);font-size:11px;color:var(--dim)}
.tl{border:1px solid var(--line);border-radius:10px;background:rgba(10,11,17,.6);padding:14px;user-select:none}
.tl-head{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--faint);margin-bottom:10px}
.tl-scroll{position:relative;cursor:crosshair}
.tl-thumbs{position:relative;height:64px;border-radius:6px;overflow:hidden;display:flex;margin-bottom:6px}
.tl-thumbs img{height:100%;flex:1;min-width:0;object-fit:cover;opacity:.85}
.tl-canvas{width:100%;height:52px;display:block;border-radius:4px}
.tl-axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:var(--faint);margin-top:6px}
.playhead{position:absolute;top:0;bottom:0;width:1.5px;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.7);pointer-events:none;z-index:5}
.mk-chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.mk{font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:5px 10px;border-radius:5px;border:1px solid;cursor:pointer;transition:transform .15s}
.mk:hover{transform:translateY(-2px)}
.mk.c{color:var(--cyan);border-color:rgba(46,230,224,.4)}
.mk.p{color:var(--pink);border-color:rgba(255,59,99,.4)}
.mk.w{color:var(--dim);border-color:var(--line2)}
.dim-block{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:20px;margin-bottom:14px}
.dim-top{display:flex;align-items:baseline;gap:12px}
.dim-top h4{font-family:var(--body);font-size:15px;font-weight:700}
.dim-val{margin-left:auto;font-family:var(--mono);font-size:23px;font-weight:600}
.factors{margin-top:14px;border-top:1px solid var(--line)}
.frow{display:grid;grid-template-columns:1fr auto 62px;gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12.5px;align-items:center}
.frow .fl{color:var(--dim)}.frow .fl b{color:var(--ink);font-weight:600;display:block;font-size:13px}
.frow .fv{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:right}
.frow .fp{font-family:var(--mono);font-size:11px;text-align:right;color:var(--cyan)}
.un-block{border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin-bottom:10px;background:rgba(255,255,255,.02)}
.un-block h5{font-size:13px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.un-block p{font-size:12px;color:var(--dim);margin-top:6px}
.un-block .free{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:6px;letter-spacing:.04em}
.un-block .free b{color:var(--cyan);font-weight:500}
.rec{border:1px solid var(--line);border-radius:12px;padding:17px 19px;margin-bottom:11px;background:var(--panel);transition:border-color .2s,opacity .2s}
.rec.rej{opacity:.42}
.rec-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rec-top h4{font-size:14px;font-family:var(--body);font-weight:600;flex:1;min-width:200px}
.rec .ts{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.rec-body{display:grid;grid-template-columns:82px 1fr;gap:12px;margin-top:12px;font-size:13px}
.rec-body .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--faint);padding-top:3px}
.rec-body .v{color:var(--dim)}.rec-body .v b{color:var(--ink)}
.rec-act{display:flex;gap:8px;margin-top:14px}
.rec-act .btn.sm.app.on{border-color:var(--cyan);color:var(--cyan);background:rgba(46,230,224,.09)}
.rec-act .btn.sm.rej2.on{border-color:var(--pink);color:var(--pink);background:rgba(255,59,99,.09)}
.lockcard{border:1px dashed var(--line2);border-radius:12px;padding:22px;background:rgba(255,255,255,.015)}
.lockcard h4{font-size:14px;font-family:var(--body);font-weight:700;display:flex;gap:10px;align-items:center}
.lockcard p{font-size:12.5px;color:var(--dim);margin-top:9px}
.lockcard .free{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:8px;line-height:1.8}
.lockcard .free b{color:var(--cyan);font-weight:500}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--faint);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:500}
td{padding:10px;border-bottom:1px solid rgba(255,255,255,.05);color:var(--dim)}
td b{color:var(--ink);font-weight:600}
.ovl{position:fixed;inset:0;background:rgba(4,4,7,.72);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:center;justify-content:center;padding:22px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:#0d0e15;border:1px solid var(--line2);border-radius:16px;width:min(480px,100%);max-height:86vh;overflow-y:auto;box-shadow:0 40px 100px -20px rgba(0,0,0,.9);animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.94) translateY(10px);opacity:0}}
.modal-h{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:15px;font-family:var(--body);font-weight:700;flex:1}
.modal-b{padding:22px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:0 22px 22px}
.mrow{margin-bottom:14px}
.mrow label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--faint);margin-bottom:7px;text-transform:uppercase}
.merr{color:var(--pink);font-size:12px;margin-top:8px;display:none}
.merr.on{display:block}
.note{border:1px solid rgba(46,230,224,.25);background:rgba(46,230,224,.05);border-radius:9px;padding:12px 15px;font-size:12.5px;color:var(--dim);line-height:1.65}
.note b{color:var(--cyan)}
.note.warn{border-color:rgba(255,59,99,.3);background:rgba(255,59,99,.05)}
.note.warn b{color:var(--pink)}
.sql{background:#0a0b10;border:1px solid var(--line);border-radius:9px;padding:15px;font-family:var(--mono);font-size:11px;line-height:1.75;color:#b8bfd4;overflow-x:auto;white-space:pre;margin-top:12px}
.sql .kw{color:var(--cyan)}.sql .cm{color:var(--faint)}
.toasts{position:fixed;top:80px;right:22px;z-index:200;display:flex;flex-direction:column;gap:9px}
.toast{background:#111219;border:1px solid var(--line2);border-left:3px solid var(--cyan);border-radius:9px;padding:12px 17px;font-size:13px;max-width:340px;box-shadow:0 16px 44px -12px rgba(0,0,0,.8);animation:tin .3s cubic-bezier(.2,.9,.3,1.15)}
.toast.err{border-left-color:var(--pink)}
.toast.warn{border-left-color:var(--ai)}
@keyframes tin{from{transform:translateX(30px);opacity:0}}
.filters{display:flex;gap:8px;margin-bottom:18px}
.filters .pchip{padding:7px 13px}
.kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--dim)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:5px}::-webkit-scrollbar-track{background:transparent}
@media(max-width:1020px){
  .hero-grid{grid-template-columns:1fr;gap:60px}
  .device{margin:0 auto}
  .fc-hook{left:-8px}.fc-rec{right:-8px}
  .pl-grid{grid-template-columns:1fr}.pl-sticky{position:static}
  .rep-cols{grid-template-columns:1fr}
  .ov-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:880px){
  .side{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .28s;box-shadow:20px 0 60px rgba(0,0,0,.5)}
  .side.open{transform:none}
  .menubtn{display:block}
  .nav-links{display:none}
  .honest-row{grid-template-columns:1fr;gap:12px}
  .mode-row{grid-template-columns:1fr;gap:10px}
  .player-grid{grid-template-columns:1fr}
  .player{max-width:240px;margin:0 auto}
  .view{padding:24px 16px 70px}
  .wrap{padding:0 18px}
  .trust{flex-direction:column;width:100%}
  .trust div{border-right:none;border-bottom:1px solid var(--line)}
  .legend{grid-template-columns:1fr}
  .scroll-cue{display:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
}

<script>
'use strict';
/* ---- safety net: never blank silently ---- */
window.addEventListener('error',function(e){
  if(document.getElementById('fatalBar'))return;
  var el=document.createElement('div');el.id='fatalBar';
  el.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#1a0d12;border:1px solid #ff3b63;color:#ffd7de;font:12px/1.6 monospace;padding:12px 16px;border-radius:10px;max-width:560px;margin-left:auto';
  el.innerHTML='<b style="color:#ff3b63">VYRALYTIC error:</b> '+String(e.message||'unknown');
  document.body.appendChild(el);
});

/* ================================================================
   SAFE STORAGE — works in sandboxed previews, file:// and hosting.
   Falls back to in-memory if localStorage is blocked, and says so.
   ================================================================ */
const storage=(function(){
  try{
    const t='__vy_probe';
    window.localStorage.setItem(t,'1');
    window.localStorage.removeItem(t);
    return window.localStorage;
  }catch(e){
    const mem={};
    return {
      _memory:true,
      getItem:k=>(k in mem?mem[k]:null),
      setItem:(k,v)=>{mem[k]=String(v)},
      removeItem:k=>{delete mem[k]}
    };
  }
})();
const STORAGE_MEMORY=!!storage._memory;

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const median=a=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2};
const std=a=>{const m=avg(a);return Math.sqrt(avg(a.map(x=>(x-m)*(x-m))))};
const I=(n,c='')=>`<svg class="ic ${c}"><use href="#i-${n}"/></svg>`;
const fmt={
  t:s=>{s=Math.max(0,s||0);const m=Math.floor(s/60),ss=s%60;return m+':'+String(Math.floor(ss)).padStart(2,'0')+'.'+Math.floor((ss%1)*10)},

const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
function toast(msg,type='ok',ms=4200){
  const t=document.createElement('div');t.className='toast '+(type==='err'?'err':type==='warn'?'warn':'');
  t.innerHTML=msg;$('#toasts').appendChild(t);

function openModal(html){
  const ovl=document.createElement('div');ovl.className='ovl';
  ovl.innerHTML=`<div class="modal">${html}</div>`;
  document.body.appendChild(ovl);
  const close=()=>{ovl.remove();document.removeEventListener('keydown',onKey)};
  const onKey=e=>{if(e.key==='Escape')close()};
  ovl.addEventListener('mousedown',e=>{if(e.target===ovl)close()});
  document.addEventListener('keydown',onKey);

function confirmModal({title,body,okLabel,danger,onOk}){
  const m=openModal(`<div class="modal-h"><h3>${esc(title)}</h3><button class="iconbtn" data-close>${I('x')}</button></div>

function copyText(txt,okMsg){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast(okMsg||'Copied to clipboard')).catch(()=>fallbackCopy(txt,okMsg));
  }else fallbackCopy(txt,okMsg);

function fallbackCopy(txt,okMsg){
  try{
    const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
    toast(okMsg||'Copied to clipboard');
  }catch(e){toast('Clipboard is blocked in this preview — select the text manually.','warn')}

function download(name,content,mime){
  try{
    const blob=new Blob([content],{type:mime||'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
    document.body.appendChild(a);a.click();a.remove();
    toast('Export started.');
  }catch(e){toast('Downloads are blocked in this preview — open the file directly in a browser to export.','warn',6000)}

function countUp(el,target,dur=900){
  if(REDUCED){el.textContent=target;return}
  const t0=performance.now();

  requestAnimationFrame(step);
}
function ringSVG(score,size=110){

const LIMITS={maxSize:150*1024*1024,maxDur:180,maxSizeAudio:80*1024*1024};
function evt(el,name,ms=8000){return new Promise((res,rej)=>{const to=setTimeout(()=>rej(new Error('timeout')),ms);el.addEventListener(name,function h(){clearTimeout(to);el.removeEventListener(name,h);res()},{once:true})})}

async function runEngine(file,platform,ui){

  const url=URL.createObjectURL(file);S.blobURLs[report.id]=url;
  const v=document.createElement('video');v.muted=true;v.preload='auto';v.src=url;
  try{await evt(v,'loadedmetadata',9000)}catch(e){ui.step(1,'err');throw new Error('This video could not be decoded in this context. Try an MP4 (H.264) or WebM export, or open the app directly in a browser tab.')}

  let trimmed=false;

  ui.step(3,'run');
  const motion=[];

  report.firstEvent=firstEvent;
  const bounds=[0,...cuts,dur].filter((x,i,arr)=>i===0||x>arr[i-1]+0.15);
  report.scenes=bounds.slice(0,-1).map((a,i)=>{const b=bounds[i+1];const inner=motion.filter(m=>m.t>a&&m.t<=b);return{a,b,motion:avg(inner.map(m=>m.mean)),len:b-a}});
  ui.step(3,'done',cuts.length+' cuts · '+report.scenes.length+' scenes · first event '+firstEvent.toFixed(2)+'s');
  ui.step(4,'run');
  report.audio={ok:false};
  try{
    if(file.size>LIMITS.maxSizeAudio)throw {soft:'file too large for in-browser audio decode ('+fmt.b(file.size)+')'};

      else if(run){if(run.b-run.a>=0.7)silence.push(run);run=null}});
    if(run&&run.b-run.a>=0.7)silence.push(run);

    ui.step(4,'done','loudness '+medDb.toFixed(1)+' dB · '+silence.length+' silent spans · lead silence '+report.audio.leadSilence.toFixed(2)+'s');
  }catch(e){
    report.audio={ok:false,note:e.soft||('no decodable audio track ('+(e.name||'decode error')+')')};
    ui.step(4,'skip',report.audio.note);
  }
  ui.step(5,'run');
  const dead=[];let lowRun=null;
  motion.forEach(m=>{
    const low=m.mean<0.35*medM,a=(m.t-(dur/N)),b=m.t;
    if(low){if(!lowRun)lowRun={a};lowRun.b=b}

  report.dead=dead.filter(d=>d.a>1);
  report.medMotion=medM;
  ui.step(5,'done',report.dead.length+' dead zones flagged');
  ui.step(6,'run');
  scoreReport(report);
  ui.step(6,'done','overall '+report.overall+' · '+report.coverage);
  ui.step(7,'skip','SpeechProvider not connected — free option: whisper.cpp (local)');
  ui.step(8,'skip','OCRProvider not connected — free option: tesseract.js');
  makeRecs(report);
  return report;
}
const band=(v,rows)=>{for(const[lim,p]of rows){if(v<=lim)return p}return rows[rows.length-1][1]};

function scoreReport(r){
  const dur=r.meta.analyzedWindow,motionM=r.medMotion||1;
  const sceneMotion=r.scenes.map(s=>s.motion);
  const S_={};let p;
  /* HOOK */
  const hf=[];let h=0;
  const fe=r.firstEvent;
  p=band(fe,[[0.8,26],[1.5,21],[2.5,13],[4,6],[1e9,2]]);h+=p;
  hf.push({l:'First visual event',v:fe.toFixed(2)+' s',p,m:26,n:'time of first scene cut or strong motion spike'});
  const ls=r.audio.ok?r.audio.leadSilence:null;
  if(ls==null){h+=12;hf.push({l:'Leading silence',v:'audio unavailable',p:12,m:24,n:'no decodable audio — scored conservatively'})}
  else{p=band(ls,[[0.15,24],[0.5,19],[1,11],[2,5],[1e9,2]]);h+=p;hf.push({l:'Leading silence',v:ls.toFixed(2)+' s',p,m:24,n:'dead air before the first meaningful sound'})}
  const omAvg=avg(sceneMotion.slice(0,2))||0, omR=omAvg/motionM;
  p=band(omR,[[0.55,6],[0.8,11],[1.05,16],[1.35,20],[1e9,17]]);h+=p;
  hf.push({l:'Opening motion energy',v:Math.round(omR*100)+'% of median',p,m:20,n:'movement in the first ~3 s vs the whole video'});
  const l0=r.frames.luma[0]??128;
  p=band(Math.abs(l0-115),[[45,15],[65,11],[85,7],[1e9,3]]);h+=p;
  hf.push({l:'Opening exposure',v:Math.round(l0)+' / 255',p,m:15,n:'very dark or blown-out openings lose viewers'});
  S_.hook={v:clamp(Math.round(h),4,98),tag:'est',factors:hf};
  /* PACING */
  const avgScene=dur/Math.max(1,r.scenes.length);
  const deadRatio=r.dead.reduce((s,d)=>s+(d.b-d.a),0)/dur;
  const pf=[];let pc=0;
  p=band(avgScene,[[2.2,30],[3.5,26],[5,20],[8,12],[12,6],[1e9,3]]);pc+=p;
  pf.push({l:'Average shot length',v:avgScene.toFixed(1)+' s',p,m:30,n:'short-form reads best between 1.5–4 s per shot'});
  p=band(deadRatio,[[0.03,20],[0.08,15],[0.15,9],[1e9,3]]);pc+=p;
  pf.push({l:'Dead-time ratio',v:Math.round(deadRatio*100)+'%',p,m:20,n:'low-motion stretches with little sonic change'});
  const varc=std(sceneMotion)/Math.max(1,median(sceneMotion));
  p=band(varc,[[0.25,6],[0.5,12],[1.3,15],[2.2,10],[1e9,6]]);pc+=p;
  pf.push({l:'Rhythm variety',v:varc.toFixed(2)+' cv',p,m:15,n:'a flat motion profile reads as static; chaos reads as noise'});
  p=band(dur,[[12,15],[20,18],[35,18],[50,12],[70,6],[1e9,3]]);pc+=p;
  pf.push({l:'Duration aptness',v:fmt.d(dur),p,m:35,n:'sweet spot for this format is roughly 15–35 s'});
  S_.pacing={v:clamp(Math.round(pc),4,98),tag:'est',factors:pf};
  /* VISUAL */
  const L=avg(r.frames.luma),LS=std(r.frames.luma),SA=avg(r.frames.sat),SH=avg(r.frames.sharp);
  const vf=[];let vc=0;
  p=band(Math.abs(L-118),[[40,25],[65,18],[90,11],[1e9,5]]);vc+=p;
  vf.push({l:'Exposure',v:Math.round(L)+' / 255',p,m:25,n:'mean frame luminance across all samples'});
  p=band(LS,[[20,5],[32,12],[75,18],[110,12],[1e9,6]]);vc+=p;
  vf.push({l:'Contrast range',v:Math.round(LS)+' σ',p,m:18,n:'luminance spread across frames'});
  p=band(SH,[[3,6],[5,12],[8,20],[1e9,16]]);vc+=p;
  vf.push({l:'Sharpness proxy',v:SH.toFixed(1)+' e/cell',p,m:20,n:'local gradient energy — soft sources score lower'});
  p=band(SA,[[10,6],[22,14],[95,18],[140,12],[1e9,8]]);vc+=p;
  vf.push({l:'Color presence',v:Math.round(SA)+' / 255',p,m:18,n:'mean saturation — grayscale and neon both penalized'});
  const hot=sceneMotion.filter(m=>m>motionM*6).length/Math.max(1,sceneMotion.length);
  p=band(hot,[[0.02,15],[0.08,10],[0.2,5],[1e9,2]]);vc+=p;
  vf.push({l:'Frame stability',v:Math.round(hot*100)+'% wild',p,m:15,n:'share of scenes with extreme inter-frame change'});
  S_.visual={v:clamp(Math.round(vc),4,98),tag:'est',factors:vf};
  /* AUDIO */
  if(r.audio.ok){
    const db=r.audio.db,silTotal=r.audio.silence.reduce((s,x)=>s+(x.b-x.a),0);
    const sorted=[...db].sort((a,b)=>a-b),q=f=>sorted[Math.floor(f*(sorted.length-1))];
    const dyn=q(0.9)-q(0.1),med=r.audio.medianDb;
    const clip=db.filter(d=>d>-1).length/db.length;
    const af=[];let ac2=0;
    p=band(silTotal/dur,[[0.05,25],[0.12,19],[0.22,12],[1e9,5]]);ac2+=p;
    af.push({l:'Silence share',v:Math.round(silTotal/dur*100)+'%',p,m:25,n:'total time under the loudness floor'});
    p=band(dyn,[[4,8],[7,16],[15,20],[24,14],[1e9,8]]);ac2+=p;
    af.push({l:'Dynamic range',v:dyn.toFixed(1)+' dB',p,m:20,n:'spread between quiet and loud passages'});
    p=band(Math.abs(med+15),[[6,20],[10,14],[16,8],[1e9,4]]);ac2+=p;
    af.push({l:'Mean loudness',v:med.toFixed(1)+' dBFS',p,m:20,n:'short-form platforms normalize near −14 dBFS'});
    p=band(clip,[[0.001,15],[0.01,10],[0.05,5],[1e9,0]]);ac2+=p;
    af.push({l:'Clipping',v:(clip*100).toFixed(2)+'%',p,m:15,n:'samples at digital ceiling'});
    S_.audio={v:clamp(Math.round(ac2*1.25),4,98),tag:'est',factors:af};
  }else S_.audio=null;

  const cfg={tiktok:{sweet:[15,34],lo:8,hi:180,hard:null,label:'TikTok'},shorts:{sweet:[20,45],lo:10,hi:60,hard:60,label:'YouTube Shorts'},reels:{sweet:[15,60],lo:8,hi:90,hard:90,label:'Instagram Reels'}}[r.platform];
  const df=[];let dc=0;
  p=(dur>=cfg.sweet[0]&&dur<=cfg.sweet[1])?40:(dur>=cfg.lo&&dur<=cfg.hi)?26:10;
  if(cfg.hard&&dur>cfg.hard)p=Math.min(p,6);
  dc+=p;df.push({l:'Duration window',v:fmt.d(dur)+(cfg.hard&&dur>cfg.hard?' — over '+cfg.hard+'s limit':''),p,m:40,n:cfg.label+' sweet spot '+cfg.sweet[0]+'–'+cfg.sweet[1]+' s (editorial heuristic)'});
  const ar=r.meta.w/r.meta.h;
  p=ar<=0.68?35:ar<=0.9?22:ar<=1.3?10:5;dc+=p;
  df.push({l:'Aspect ratio',v:ar.toFixed(2)+':1',p,m:35,n:'vertical 9:16 (≈0.56) is native for this platform'});
  p=r.meta.h>=1080?25:r.meta.h>=720?18:10;dc+=p;
  df.push({l:'Resolution',v:r.meta.h+'p',p,m:25,n:'1080p or higher keeps text overlays legible'});
  S_.platform={v:clamp(Math.round(dc),4,98),tag:'est',factors:df};
  /* RETENTION RISK */
  const rf=[];let rc=100;
  rc-=(100-S_.hook.v)*0.25;rf.push({l:'Hook leakage',v:'−'+Math.round((100-S_.hook.v)*0.25),n:'weak openings bleed early viewers'});
  const deadPen=Math.min(30,r.dead.length*10+r.dead.reduce((s,d)=>s+(d.b-d.a),0)*4);
  rc-=deadPen;rf.push({l:'Mid-video dead zones',v:'−'+Math.round(deadPen)+' ('+r.dead.length+' found)',n:'each dead stretch compounds drop-off'});
  const last=r.scenes[r.scenes.length-1];
  if(last&&last.len>dur*0.3&&last.motion<motionM*0.5){rc-=8;rf.push({l:'Flat ending',v:'last '+last.len.toFixed(1)+' s low-motion',n:'slow tails hurt completion rate'})}
  if(dur>60){rc-=6;rf.push({l:'Length risk',v:fmt.d(dur),n:'beyond 60 s completion decays sharply in short-form'})}
  S_.retention={v:clamp(Math.round(rc),10,95),tag:'est',factors:rf};
  /* OVERALL */
  const parts=[['hook',.26],['pacing',.2],['visual',.18],['audio',.16],['platform',.1],['retention',.1]].filter(([k])=>S_[k]);
  r.overall=Math.round(parts.reduce((s,[k,w])=>s+S_[k].v*w,0)/parts.reduce((s,[,w])=>s+w,0));
  r.scores=S_;
  r.coverage='computed from '+parts.length+' of 11 dimensions — text, speech, topic signals unavailable locally';
}
function makeRecs(r){
  const recs=[];let n=1;
  const add=(priority,t,title,problem,fix,reason)=>recs.push({id:'r'+(n++),priority,t,title,problem,fix,reason,status:null});
  const dur=r.meta.analyzedWindow,ls=r.audio.ok?r.audio.leadSilence:0;
  if(ls>=0.4)add('high',0,'Cut the first '+ls.toFixed(1)+'s of leading silence',
    'The video opens with '+ls.toFixed(2)+'s of near-silence before the first meaningful sound.',
    'Trim or hard-open on the first audible moment. Recover '+ls.toFixed(1)+'s of attention budget.',
    'Short-form feeds punish dead openings — sound is the fastest re-engagement channel.');
  if(r.firstEvent>=1.6)add('high',r.firstEvent,'Open on your strongest shot',
    'The first visual event (scene change / motion spike) does not land until '+r.firstEvent.toFixed(2)+'s.',
    'Move the strongest reveal into the first 1–1.5 s, or open on the current peak frame.',
    'The opening currently holds low-information frames before the primary event.');
  r.dead.forEach(d=>add('medium',d.a,'Tighten dead section '+fmt.t(d.a)+'–'+fmt.t(d.b),
    'A '+(d.b-d.a).toFixed(1)+'s low-motion stretch overlaps reduced sonic change.',
    'Cut, speed-ramp, or add an overlay/text beat inside this window.',
    'Silence plus stillness is the strongest measured predictor of swipe-away.'));
  const avgScene=dur/Math.max(1,r.scenes.length);
  if(avgScene>=6)add('medium',0,'Increase cutting rhythm',
    'Average shot length is '+avgScene.toFixed(1)+'s — well above the 1.5–4s short-form norm.',
    'Break long scenes into 2–3 shots or add progressive reveals.',
    'Measured motion variety is flat across the timeline.');
  if(avgScene<0.9&&r.cuts.length>10)add('low',0,'Slow the cut rate',
    r.cuts.length+' cuts in '+fmt.d(dur)+' reads as visual noise on small screens.',
    'Hold key shots ≥1.2s so each beat registers.',
    'Extremely fast cutting lowers per-frame information uptake.');
  const ar=r.meta.w/r.meta.h;
  if(ar>0.68)add('medium',0,'Reframe to 9:16 vertical',
    'Source aspect is '+ar.toFixed(2)+':1 — not native for '+r.platform.toUpperCase()+' placement.',
    'Reframe to 9:16 (or export a vertical master) so the frame fills the feed.',
    'Non-native aspect ratios surrender 30–50% of screen real estate.');
  const cfg={tiktok:[15,34],shorts:[20,45],reels:[15,60]}[r.platform];
  if(dur<cfg[0]*0.7)add('medium',0,'Extend runtime toward '+cfg[0]+'–'+cfg[1]+'s',
    'At '+fmt.d(dur)+', the video is shorter than the measured sweet spot for this platform.',
    'Add a payoff beat, context beat, or loop-friendly ending.',
    'Very short videos limit watch-time accumulation.');
  if(dur>cfg[1]*1.6)add('high',0,'Trim toward '+cfg[0]+'–'+cfg[1]+'s',
    'At '+fmt.d(dur)+', this is '+Math.round(dur/cfg[1]*100)+'% of the sweet-spot ceiling.',
    'Cut the weakest measured scene (see timeline) and tighten dead sections.',
    'Completion rate — the strongest ranking signal — decays with length.');
  const L=avg(r.frames.luma);
  if(L<55)add('low',0,'Raise exposure',
    'Mean frame luminance is '+Math.round(L)+'/255 — dark footage loses text legibility.',
    'Lift exposure or add a subtle contrast grade.',
    'Dark openings scored in the bottom exposure band of the visual analysis.');
  if(avg(r.frames.sat)<12)add('low',0,'Consider color presence',
    'Mean saturation is '+Math.round(avg(r.frames.sat))+'/255 — the palette reads as near-grayscale.',
    'A restrained color accent on the key subject can lift visual scoring.',
    'Measured color presence sits in the lowest saturation band.');
  r.recs=recs;
}

function mountHeroCanvas(){
  const cv=$('#heroCv');if(!cv)return;
  const ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
  const strip=$('#heroStrip');
  let raf,t0=performance.now(),lastShot=-1,shotStart=0,cuts=0;
  const palettes=[['#0e2b2e','#2ee6e0'],['#2a0e18','#ff3b63'],['#14102b','#9b8bff'],['#101014','#f4f5f9'],['#0e2318','#57e389'],['#2b1c0e','#ffb02e']];
  const shot=t=>Math.floor(t/2.3);
  function draw(now){
    const t=(now-t0)/1000,si=shot(t),pal=palettes[si%palettes.length];
    if(si!==lastShot){
      lastShot=si;shotStart=t;cuts++;
      const eC=$('#hCuts'),eL=$('#hLast'),eR=$('#hRec');
      if(eC)eC.textContent=cuts;
      if(eL)eL.textContent='0:'+String(Math.floor(t)).padStart(2,'0')+'.'+Math.floor((t%1)*10);
      if(eR)eR.innerHTML='Structural change at <b>'+t.toFixed(2)+'s</b> — '+(cuts*31)+'% of cells shifted. Logged as scene #'+cuts+'.';
      const th=document.createElement('canvas');th.width=24;th.height=42;
      try{th.getContext('2d').drawImage(cv,0,0,24,42)}catch(e){}
      strip.appendChild(th);
      if(strip.children.length>9)strip.removeChild(strip.firstChild);
    }
    ctx.fillStyle=pal[0];ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=.9;
    for(let i=0;i<7;i++){
      const ph=t*1.4+i*1.7;
      const x=W/2+Math.sin(ph)*W*0.26,y=H*0.18+i*H*0.09+Math.cos(ph*.7)*10;
      ctx.fillStyle=i%2?pal[1]:'rgba(255,255,255,.5)';
      const s=10+((i*37+Math.floor(t*3))%26);
      ctx.fillRect(x-s/2,y-s/2,s,s);
    }
    ctx.globalAlpha=.16;ctx.strokeStyle=pal[1];
    for(let i=0;i<6;i++){ctx.beginPath();ctx.moveTo(0,H*0.25+i*H*0.12+Math.sin(t+i)*8);ctx.lineTo(W,H*0.22+i*H*0.12);ctx.stroke()}
    ctx.globalAlpha=1;
    const sy=(t*90)%H;
    const gr=ctx.createLinearGradient(0,sy-26,0,sy+3);
    gr.addColorStop(0,'rgba(46,230,224,0)');gr.addColorStop(1,'rgba(46,230,224,.28)');
    ctx.fillStyle=gr;ctx.fillRect(0,sy-26,W,29);
    ctx.fillStyle='rgba(46,230,224,.9)';ctx.fillRect(0,sy,W,1.5);
    ctx.fillStyle='rgba(255,255,255,.75)';
    for(let i=0;i<40;i++){
      const v=Math.abs(Math.sin(t*6+i*.55)*Math.cos(t*2.3+i*.21))*26+3;
      ctx.fillRect(8+i*8.7,H-38-v/2,3.4,v);
    }
    const curMotion=40+Math.sin(t*2.1)*35+Math.sin(t*5.3)*12;
    const eM=$('#hMot'),eS=$('#hScan');
    if(eM)eM.textContent=Math.round(clamp(curMotion,0,100))+'%';
    if(eS)eS.textContent=(sy/H*100).toFixed(0)+'%';
    raf=requestAnimationFrame(draw);
  }
  raf=requestAnimationFrame(draw);
  addCleanup(()=>cancelAnimationFrame(raf));
}
function mountHero3D(){
  const inner=$('#tiltInner'),field=$('#depthField'),heroEl=$('#heroStage');
  if(!inner||!field||!heroEl||REDUCED)return;
  const coarse=matchMedia('(pointer:coarse)').matches;
  let raf=null,mx=0,my=0,sy=0,running=true;
  if(!coarse)addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5},{passive:true});
  addEventListener('scroll',()=>{sy=window.scrollY},{passive:true});
  const ctx=field.getContext('2d');
  let W=0,H=0;const dpr=Math.min(devicePixelRatio||1,2);
  function size(){const r=heroEl.getBoundingClientRect();W=r.width;H=r.height;field.width=W*dpr;field.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  size();addEventListener('resize',size);
  function sprite(color){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,color);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);return c}
  const spC=sprite('rgba(46,230,224,.9)'),spP=sprite('rgba(255,59,99,.9)'),spW=sprite('rgba(255,255,255,.9)');
  const N=coarse?46:90;
  const pts=Array.from({length:N},()=>({x:Math.random(),y:Math.random(),z:Math.random(),vx:(Math.random()-.5)*.00012,vy:(Math.random()-.5)*.00008,ph:Math.random()*6.28,k:Math.random()<.16?'p':(Math.random()<.5?'c':'w')}));
  const floaters=$$('[data-float]');
  let t0=performance.now();
  function frame(now){
    if(!running){raf=null;return}
    const t=(now-t0)/1000;
    const p=clamp(sy/(innerHeight*.85),0,1);
    inner.style.transform='rotateX('+(9*(1-p)-my*4).toFixed(2)+'deg) rotateY('+(mx*7).toFixed(2)+'deg) translateY('+(-34*p).toFixed(1)+'px) scale('+(1-.035*p).toFixed(3)+')';
    floaters.forEach(el=>{const d=+el.dataset.float||0;el.style.transform='translateY('+(-sy*d).toFixed(1)+'px)'});
    ctx.clearRect(0,0,W,H);
    for(const q of pts){
      q.x+=q.vx;q.y+=q.vy;
      if(q.x<0)q.x+=1;if(q.x>1)q.x-=1;if(q.y<0)q.y+=1;if(q.y>1)q.y-=1;
      const px=q.x*W+mx*q.z*46+Math.sin(t*.5+q.ph)*8;
      const py=q.y*H+my*q.z*30+sy*q.z*.25+Math.cos(t*.4+q.ph)*6;
      const s=(1.5+q.z*4.5);
      ctx.globalAlpha=.12+q.z*.45*(0.75+0.25*Math.sin(t+q.ph));
      ctx.drawImage(q.k==='p'?spP:(q.k==='c'?spC:spW),px-s*2,py-s*2,s*4,s*4);
    }
    ctx.globalAlpha=1;
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
  const vio=new IntersectionObserver(es=>{
    if(es[0].isIntersecting){if(!running){running=true;raf=requestAnimationFrame(frame)}}
    else running=false;
  },{threshold:0});
  vio.observe(heroEl);
  addCleanup(()=>{running=false;if(raf)cancelAnimationFrame(raf);removeEventListener('resize',size);vio.disconnect()});
}

function observedInsights(analyzed){
  const sorted=[...analyzed].sort((a,b)=>b.overall-a.overall);

  const feTop=avg(top.map(p=>p.firstEvent));
  return `<ul style="list-style:none;font-size:13px;color:var(--dim);display:grid;gap:10px">
    <li><span class="tag det" style="margin-right:8px">OBSERVED</span>Your higher-scored half averages <b style="color:var(--ink)">${fmt.d(dTop)}</b> vs <b style="color:var(--ink)">${bot.length?fmt.d(dBot):'—'}</b> for the lower half.</li>
    <li><span class="tag det" style="margin-right:8px">OBSERVED</span>Your top projects land their first visual event at <b style="color:var(--ink)">${feTop.toFixed(2)}s</b> on average.</li>

  </ul>`;
}

async function startAnalysis(file){
  if(AV.running)return;
  AV.running=true;AV.phase='processing';AV.mode='new';AV.file=file;
  renderProcessing($('#viewbox'));
  const host=$('#viewbox');
  const steps=['Validate source','Extract metadata','Sample frames','Detect scene cuts','Decode audio map','Fuse signals','Score synthesis','Transcript (speech → text)','Text / OCR scan'];
  const rows=$$('.pipe-row',host);
  const setSt=(i,st,detail)=>{
    const r=rows[i];if(!r)return;
    r.className='pipe-row '+(st==='run'?'run':st==='done'?'done':st==='skip'?'skip':'err');
    r.querySelector('.st').innerHTML=st==='run'?'<span class="spin"></span>':(st==='done'?`<span style="color:var(--cyan)">${I('check')}</span>`:(st==='skip'?'—':`<span style="color:var(--pink)">${I('x')}</span>`));
    if(detail)r.querySelector('.dt').textContent=detail;
  };
  const prog=$('#pipe-prog i',host);
  const ui={step:setSt,progress:f=>{if(prog)prog.style.width=(f*100).toFixed(1)+'%'}};
  try{
    const report=await runEngine(file,S.platform,ui);
    report.name=file.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ');
    report.thumb=report.frames.thumbs[0]?.src||null;
    Store.addProject(report);
    AV.report=report;AV.phase='done';AV.mode='idle';AV.running=false;
    toast('Analysis complete — overall '+report.overall+'/100.');
    renderApp('analyze');
  }catch(err){
    AV.phase='idle';AV.running=false;
    toast(err.message||'Video analysis could not complete.','err',6000);
    renderApp('analyze');
  }
}
function renderProcessing(box){
  const steps=['Validate source','Extract metadata','Sample frames','Detect scene cuts','Decode audio map','Fuse signals','Score synthesis','Transcript (speech → text)','Text / OCR scan'];
  box.innerHTML=`
    <div class="kick dim" style="margin-bottom:14px">PROCESSING · ${esc((AV.file||{}).name||'source')} · ${S.platform.toUpperCase()} MODE</div>
    <div class="pipe">${steps.map((s,i)=>`<div class="pipe-row"><span class="st" style="opacity:.4">${i+1}</span><span>${s}</span><span class="dt">${i>=7?'PROVIDER NOT CONNECTED':''}</span></div>`).join('')}</div>

    <p class="mono" style="font-size:10.5px;color:var(--faint);letter-spacing:.08em;margin-top:12px">RUNNING ON-DEVICE · THE RUN CONTINUES AND THE REPORT SAVES AUTOMATICALLY</p>`;
}

        <div class="free">FREE PATHS — <b>OLLAMA</b> (LOCAL, NO COST) · HOSTED FREE TIERS · INTERFACE: <b>AIProvider.generateMetadata(report)</b><br>TITLES &amp; HASHTAGS WILL BE DERIVED FROM DETECTED SCENES + TRANSCRIPT — NEVER GENERIC LISTS.</div>
      </div>
    </div>`;
  activateRings(host);
  $('#rep-name',host).addEventListener('click',()=>{
    const m=openModal(`<div class="modal-h"><h3>Rename project</h3><button class="iconbtn" data-close>${I('x')}</button></div>
      <div class="modal-b"><div class="mrow"><input id="rn" value="${esc(r.name)}"></div></div>
      <div class="modal-f"><button class="btn btn-pri sm" id="rn-ok">Save</button></div>`);
    $('#rn-ok',m.root).addEventListener('click',()=>{const v=$('#rn',m.root).value.trim();if(v){r.name=v;Store.updateProject(r.id,x=>x.name=v);$('#rep-name',host).textContent=v;toast('Renamed.')}m.close()});
  });
  $$('[data-set]',host).forEach(b=>b.addEventListener('click',()=>{
    const rid=b.closest('[data-rid]').dataset.rid,st=b.dataset.set;
    const rec=r.recs.find(x=>x.id===rid);rec.status=rec.status===st?null:st;
    Store.updateProject(r.id,p=>{const x=p.recs.find(y=>y.id===rid);if(x)x.status=rec.status});
    mountReport(host,r);
  }));
  const planBtn=$('#btn-plan',host);
  if(planBtn)planBtn.addEventListener('click',()=>{
    const appr=r.recs.filter(x=>x.status==='approved');
    if(!appr.length)return toast('Approve at least one recommendation first.','warn');
    const md=appr.map((x,i)=>`${i+1}. [${x.priority.toUpperCase()}] @${fmt.t(x.t)} — ${x.title}\n   FIX: ${x.fix}\n   WHY: ${x.reason}`).join('\n\n');
    const m=openModal(`<div class="modal-h"><h3>Optimization plan — ${esc(r.name)}</h3><button class="iconbtn" data-close>${I('x')}</button></div>
      <div class="modal-b">
        <ol style="padding-left:20px;color:var(--dim);font-size:13px;display:grid;gap:10px">${appr.map(x=>`<li><b style="color:var(--ink)">${esc(x.title)}</b> <span class="mono" style="font-size:10px;color:var(--faint)">@${fmt.t(x.t)}</span></li>`).join('')}</ol>
        <div class="note" style="margin-top:18px"><b>Apply changes automatically:</b> requires the video processing engine (ffmpeg.wasm — free, runs in-browser). Not implemented in this build; the plan exports cleanly to any editor.</div>
      </div>
      <div class="modal-f"><button class="btn btn-ghost sm" id="plan-copy">${I('copy')} Copy as Markdown</button><button class="btn btn-pri sm" data-close>Done</button></div>`);
    $('#plan-copy',m.root).addEventListener('click',()=>copyText('# VYRALYTIC optimization plan — '+r.name+'\n\n'+md,'Plan copied as Markdown'));
  });
  const recBtn=$('#btn-recreate',host);
  if(recBtn)recBtn.addEventListener('click',()=>openModal(`<div class="modal-h"><h3>Recreate &amp; Optimize</h3><button class="iconbtn" data-close>${I('x')}</button></div>
    <div class="modal-b"><p style="color:var(--dim);font-size:13.5px;line-height:1.7">Full auto-recreation (new hook, reframing, transitions, regenerated audio) needs a <b style="color:var(--ink)">VideoGenerationProvider</b>. I won't promise operations no connected provider can perform — so this ships as an adapter slot with a defined interface, not a fake button.</p>
    <div class="note" style="margin-top:16px"><b>Honest status:</b> adapter interface defined · no provider configured · nothing is simulated.</div></div>
    <div class="modal-f"><button class="btn btn-pri sm" data-close>Understood</button></div>`));
  const dur=r.meta.analyzedWindow;
  const tlc=$('#tlc',host),tls=$('#tls',host);
  function drawTL(){
    const W=tlc.clientWidth||600;tlc.width=W;tlc.height=52;
    const c=tlc.getContext('2d');
    c.clearRect(0,0,W,52);
    if(r.audio.ok){c.fillStyle='rgba(255,59,99,.18)';
      r.audio.silence.forEach(s=>{c.fillRect(s.a/dur*W,0,(s.b-s.a)/dur*W,52)})}
    c.strokeStyle='rgba(255,59,99,.55)';c.lineWidth=1;
    r.dead.forEach(d=>{const x=d.a/dur*W,w=Math.max(2,(d.b-d.a)/dur*W);
      for(let hx=x;hx<x+w;hx+=5){c.beginPath();c.moveTo(hx,40);c.lineTo(hx-8,52);c.stroke()}});
    const times=r.frames.times;
    const yAt=t=>{const sc=r.scenes.find(s=>t>s.a&&t<=s.b);const v=sc?clamp(sc.motion/(r.medMotion*3),0.05,1):0.1;return 52-v*46};
    c.beginPath();c.moveTo(0,52);
    times.forEach(t=>c.lineTo(t/dur*W,yAt(t)));
    c.lineTo(W,52);c.closePath();
    c.fillStyle='rgba(46,230,224,.2)';c.fill();
    c.beginPath();times.forEach((t,i)=>{const x=t/dur*W,y=yAt(t);i?c.lineTo(x,y):c.moveTo(x,y)});
    c.strokeStyle='rgba(46,230,224,.85)';c.lineWidth=1.4;c.stroke();
    c.fillStyle='rgba(46,230,224,.1)';c.fillRect(0,0,Math.min(3,dur)/dur*W,52);
    c.fillStyle='rgba(255,255,255,.85)';
    r.cuts.forEach(t=>{c.fillRect(t/dur*W-0.75,0,1.5,10)});
  }
  drawTL();
  const onRes=()=>drawTL();addEventListener('resize',onRes);
  addCleanup(()=>removeEventListener('resize',onRes));
  function seekTo(t){
    const pv=$('#pv',host);
    if(pv)pv.currentTime=clamp(t,0,dur-0.05);
    const ph=$('#ph',host);ph.style.left=(clamp(t,0,dur)/dur*100)+'%';
    const tm=$('#pv-time',host);if(tm&&pv)tm.textContent=fmt.t(pv.currentTime)+' / '+fmt.t(dur);
  }
  $$('[data-seek]',host).forEach(mk=>mk.addEventListener('click',()=>{
    seekTo(+mk.dataset.seek);
    $('#pv-wrap',host)?.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'nearest'});
  }));
  tls.addEventListener('mousedown',e=>{
    const rect=tls.getBoundingClientRect();
    const onMove=ev=>seekTo(clamp((ev.clientX-rect.left)/rect.width,0,1)*dur);
    onMove(e);
    const up=()=>{removeEventListener('mousemove',onMove);removeEventListener('mouseup',up)};
    addEventListener('mousemove',onMove);addEventListener('mouseup',up);
  });
  const pv=$('#pv',host);
  if(pv){
    const pp=$('#pv-pp',host),big=$('#pv-big',host),tm=$('#pv-time',host),mute=$('#pv-mute',host);
    const setIcon=()=>{pp.innerHTML=I(pv.paused?'play':'pause');big.style.opacity=pv.paused?1:0};
    const toggle=()=>{if(pv.paused)pv.play().catch(()=>toast('Playback blocked — tap the video once more.','warn'));else pv.pause()};
    pp.addEventListener('click',toggle);big.addEventListener('click',toggle);pv.addEventListener('click',toggle);
    pv.addEventListener('play',()=>{setIcon();tickPH()});
    pv.addEventListener('pause',setIcon);
    pv.addEventListener('ended',setIcon);
    mute.addEventListener('click',()=>{pv.muted=!pv.muted;mute.style.color=pv.muted?'':'var(--cyan)'});
    let rafId=null;
    function tickPH(){
      cancelAnimationFrame(rafId);
      const loop=()=>{
        const ph=$('#ph',host),t2=$('#pv-time',host);
        if(ph)ph.style.left=(clamp(pv.currentTime,0,dur)/dur*100)+'%';
        if(t2)t2.textContent=fmt.t(pv.currentTime)+' / '+fmt.t(dur);
        if(!pv.paused)rafId=requestAnimationFrame(loop)};
      loop();
    }
    pv.addEventListener('seeked',()=>{if(pv.paused){const ph=$('#ph',host),t2=$('#pv-time',host);if(ph)ph.style.left=(clamp(pv.currentTime,0,dur)/dur*100)+'%';if(t2)t2.textContent=fmt.t(pv.currentTime)+' / '+fmt.t(dur)}});
  }else{
    const ra=$('#reattach',host);
    if(ra)ra.addEventListener('click',()=>{
      const fi=document.createElement('input');fi.type='file';fi.accept='video/*';
      fi.onchange=()=>{const f=fi.files[0];if(f){S.blobURLs[r.id]=URL.createObjectURL(f);mountReport(host,r);toast('Source re-attached — playback restored.')}};
      fi.click();
    });
  }
}

Views.performance=box=>{
  const analyzed=S.projects.filter(p=>p.overall!=null);
  box.innerHTML=`<div class="panel" style="max-width:860px">
    <h3>${I('chart')} Record real results <span class="tag det">MANUAL ENTRY · WORKS NOW</span></h3>
    <p style="color:var(--dim);font-size:13.5px;margin-bottom:18px">Paste the actual numbers from your platform after posting. VYRALYTIC computes engagement rate and compares predicted score vs observed outcome. <b style="color:var(--ink)">Never auto-fetched in this build</b>; platform metrics need an OAuth connection.</p>
    ${analyzed.length?`<div class="mrow"><label>Project</label><select id="pf-p">${analyzed.map(p=>`<option value="${p.id}">${esc(p.name)} — ${p.overall}/100</option>`).join('')}</select></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px">
      ${['Views','Likes','Comments','Shares'].map(f=>`<div class="mrow"><label>${f}</label><input type="number" min="0" id="pf-${f.toLowerCase()}" placeholder="0"></div>`).join('')}
    </div>
    <button class="btn btn-cyan sm" id="pf-save" style="margin-top:6px">${I('plus')} Record result</button>
    <div style="margin-top:26px" id="pf-table"></div>`
    :`<div class="empty">${I('chart')}<div>No analyzed projects yet — analyze a video first.</div></div>`}
  </div>`;
  function renderTable(){
    const host=$('#pf-table',box);if(!host)return;
    const rows=[];
    S.projects.forEach(p=>(p.perf||[]).forEach(e=>rows.push({p,e})));
    if(!rows.length){host.innerHTML='<p class="mono" style="font-size:10.5px;color:var(--faint);letter-spacing:.1em">NO ENTRIES YET — RECORDED RESULTS APPEAR HERE WITH COMPUTED ENGAGEMENT RATE.</p>';return}
    const avgEr=avg(rows.map(r=>r.e.views?(r.e.likes+r.e.comments+r.e.shares)/r.e.views*100:0));
    host.innerHTML=`<h3 style="font-size:14px;margin-bottom:12px">${I('target')} Prediction vs outcome <span class="tag det">OBSERVED</span></h3>
      <table><thead><tr><th>PROJECT</th><th>PREDICTED</th><th>VIEWS</th><th>ENG. RATE</th><th>VS YOUR AVG</th><th>DATE</th></tr></thead><tbody>
      ${rows.map(x=>{const er=x.e.views?(x.e.likes+x.e.comments+x.e.shares)/x.e.views*100:0;const d=er-avgEr;
        return `<tr><td><b>${esc(x.p.name)}</b></td><td class="mono">${x.p.overall}/100</td><td class="mono">${x.e.views.toLocaleString()}</td><td class="mono">${er.toFixed(2)}%</td><td class="mono" style="color:${d>=0?'var(--cyan)':'var(--pink)'}">${d>=0?'+':''}${d.toFixed(2)}pp</td><td class="mono">${fmt.date(x.e.date)}</td></tr>`}).join('')}
      </tbody></table>
      <p class="mono" style="font-size:10px;color:var(--faint);letter-spacing:.08em;margin-top:12px">YOUR OBSERVED AVERAGE ENGAGEMENT: ${avgEr.toFixed(2)}% · COMPUTED ONLY FROM NUMBERS YOU ENTERED</p>`;
  }
  renderTable();
  const sv=$('#pf-save',box);
  if(sv)sv.addEventListener('click',()=>{
    const pid=$('#pf-p',box).value;
    const v=+$('#pf-views',box).value||0,l=+$('#pf-likes',box).value||0,c=+$('#pf-comments',box).value||0,s=+$('#pf-shares',box).value||0;
    if(!v)return toast('Enter at least a view count.','warn');
    Store.updateProject(pid,p=>{p.perf=p.perf||[];p.perf.unshift({date:Date.now(),views:v,likes:l,comments:c,shares:s})});

  });
};

  +'<span class="kw">create table</span> projects (\n  id uuid <span class="kw">primary key default</span> gen_random_uuid(),\n  user_id uuid <span class="kw">not null references</span> auth.users <span class="kw">on delete cascade</span>,\n  name text <span class="kw">not null</span>, platform text <span class="kw">default</span> \'tiktok\',\n  status text <span class="kw">default</span> \'analyzed\', overall_score numeric,\n  thumb_url text, archived bool <span class="kw">default false</span>,\n  created_at timestamptz <span class="kw">default</span> now());\n\n'
  +'<span class="kw">create table</span> videos (\n  id uuid <span class="kw">primary key default</span> gen_random_uuid(),\n  project_id uuid <span class="kw">references</span> projects <span class="kw">on delete cascade</span>,\n  storage_path text, duration numeric, width <span class="kw">int</span>, height <span class="kw">int</span>, size_bytes bigint);\n\n'

  +'<span class="kw">create table</span> platform_connections (\n  id uuid <span class="kw">primary key default</span> gen_random_uuid(),\n  user_id uuid <span class="kw">references</span> auth.users <span class="kw">on delete cascade</span>,\n  platform text, scopes text,\n  created_at timestamptz <span class="kw">default</span> now());\n\n'
  +'<span class="kw">create table</span> project_events (\n  id uuid <span class="kw">primary key default</span> gen_random_uuid(),\n  project_id uuid <span class="kw">references</span> projects <span class="kw">on delete cascade</span>,\n  kind text, detail jsonb, created_at timestamptz <span class="kw">default</span> now());\n\n'
  +'<span class="cm">-- RLS: users see only their own rows (repeat per table)</span>\n'
  +'<span class="kw">alter table</span> projects <span class="kw">enable row level security</span>;\n'
  +'<span class="kw">create policy</span> "own_rows" <span class="kw">on</span> projects\n  <span class="kw">for all using</span> (auth.uid() = user_id)\n  <span class="kw">with check</span> (auth.uid() = user_id);';
  $('#st-sql',box).innerHTML=SQL;
  $('#st-cp',box).addEventListener('click',()=>copyText($('#st-sql',box).innerText,'Schema copied'));
  $('#st-exp',box).addEventListener('click',()=>download('vyralytic-export.json',JSON.stringify(S.projects,null,2)));
  $('#st-wipe',box).addEventListener('click',()=>confirmModal({title:'Erase all local data',body:'Every project, analysis and recorded result will be permanently removed. This cannot be undone.',okLabel:'Erase everything',danger:true,onOk:()=>{try{storage.removeItem('vy.projects')}catch(e){}S.projects=[];toast('All local data erased.');rerender()}}));
};

/* boot */
route();
if(STORAGE_MEMORY){
  setTimeout(()=>toast('<b>Preview sandbox detected.</b> Everything works, but data won\u2019t survive closing this tab. Download the file and open it directly in your browser for full persistence.','warn',12000),800);
}
</script>
</body>
</html>
